# Required top-level block (even if empty)
events {}

http {
  # Keep logs local to this temp project (optional)
  access_log logs/access.log;
  error_log  logs/error.log;

  # Recommended: tighter proxy defaults
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;

  server {
    # You'll need sudo to bind to 443 on macOS
    listen 443 ssl;
    server_name auth.gcp-global-dev-1.nuclia.io;

    # >>> Replace these with your mkcert outputs <<<
    ssl_certificate     /absolute/path/to/auth.gcp-global-dev-1.nuclia.io.pem;
    ssl_certificate_key /absolute/path/to/auth.gcp-global-dev-1.nuclia.io-key.pem;

    # Forward EVERYTHING under this host to your Angular dev server
    location / {
      proxy_pass http://127.0.0.1:4201;
    }
  }

  server {
    # You'll need sudo to bind to 443 on macOS
    listen 443 ssl;
    server_name rag.gcp-global-dev-1.nuclia.io;

    # >>> Replace these with your mkcert outputs <<<
    ssl_certificate     /absolute/path/to/rag.gcp-global-dev-1.nuclia.io.pem;
    ssl_certificate_key /absolute/path/to/rag.gcp-global-dev-1.nuclia.io-key.pem;

    # Forward EVERYTHING under this host to your Angular dev server
    location / {
      proxy_pass http://127.0.0.1:4200;
    }
  }

  server {
    # You'll need sudo to bind to 443 on macOS
    listen 443 ssl;
    server_name admin.gcp-global-dev-1.nuclia.io;

    # >>> Replace these with your mkcert outputs <<<
    ssl_certificate     /absolute/path/to/admin.gcp-global-dev-1.nuclia.io.pem;
    ssl_certificate_key /absolute/path/to/admin.gcp-global-dev-1.nuclia.io-key.pem;

    # Forward EVERYTHING under this host to your Angular dev server
    location / {
      proxy_pass http://127.0.0.1:4300;
    }
  }
}