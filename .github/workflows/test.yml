name: Test
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read # Needed in case once we enable merge queues.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install project dependencies
        run: |-
          yarn install --immutable
          for i in 1 2 3; do
            yarn missdev
            [ -f libs/pastanaga-angular/package.json ] && break
            echo "pastanaga-angular checkout missing, retrying ($i)..."
            rm -rf libs/pastanaga-angular
            sleep 5
          done
          [ -f libs/pastanaga-angular/package.json ] || { echo "::error::pastanaga-angular failed to check out after retries"; exit 1; }
      - name: Unit tests
        run: npx nx affected --target=test --parallel=3 --exclude=sdk-demo,search-widget-demo,sistema-demo,rao-demo,rao-widget,platform
      - name: Check if build succeeds
        run: npx nx affected --target=build --parallel=3 --configuration production --exclude=sdk-demo,search-widget-demo,rao-demo,rao-widget,platform
