<span
  class="icon-and-text"
  [class.no-content]="!hasContent">
  @if (icon(); as iconName) {
    <pa-icon
      [name]="iconName"
      size="small"></pa-icon>
  }
  <span
    #content
    paEllipsisTooltip
    class="text">
    <ng-content></ng-content>
  </span>
</span>

@if (displayValue()) {
  <span class="count">{{ displayValue() }}</span>
}
