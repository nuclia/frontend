<div class="dashboard-layout">
  @if (!(noNavBar | async)) {
    <nav [class.collapsed]="collapsedNav()">
      <app-navbar></app-navbar>
    </nav>
  }

  <div
    class="dashboard-content"
    [class.full-width]="collapsedNav() || (noNavBar | async)">
    @if (showStatusBar | async) {
      <div class="status-bar">
        @if (showProgress | async) {
          <stf-upload-bar></stf-upload-bar>
        }
        @if (showLimit | async) {
          <nsi-info-card
            type="warning"
            icon="warning">
            {{ 'upload.limit-warning' | translate: { limit: pendingResourceslimit | number } }}
          </nsi-info-card>
        }
      </div>
    }
    <main
      id="dashboard-main"
      tabindex="-1"
      [class.with-status-bar]="showStatusBar | async">
      <div class="dashboard-main-content">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
