<div class="onboarding-form">
  <pa-radio-group
    [formControl]="modelControl"
    noBackground>
    @for (option of options; track option.name) {
      <div class="option-container">
        <pa-radio [value]="option.value">
          {{ 'onboarding.language.options.' + option.name | translate }}
        </pa-radio>
        @if (option.name === 'MULTILINGUAL_ALPHA') {
          <div>
            <pa-icon
              name="info"
              [paPopover]="languageList"></pa-icon>
            <pa-popover #languageList>
              <div [innerHTML]="'onboarding.language.other-languages' | translate"></div>
            </pa-popover>
          </div>
        }
      </div>
    }
  </pa-radio-group>
</div>

<nsi-sticky-footer>
  <pa-button
    aspect="basic"
    (click)="goBack()">
    {{ 'generic.back' | translate }}
  </pa-button>
  <pa-button
    kind="primary"
    [disabled]="modelControl.invalid"
    (click)="submitForm()">
    {{ (isLastStep ? 'onboarding.final-button' : 'onboarding.next-button') | translate }}
  </pa-button>
</nsi-sticky-footer>
