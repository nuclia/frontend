<div class="topbar">
  <div class="topbar-context">
    <button
      type="button"
      class="topbar-logo"
      (click)="goToHome()">
      <img
        class="topbar-logo-expanded"
        [src]="logoPath | async"
        [alt]="brandName" />
    </button>

    @if (showKbSwitch) {
      <app-kb-switch></app-kb-switch>
    }
  </div>

  <div class="topbar-actions">
    <stf-plan-status></stf-plan-status>
    <app-user-menu
      data-cy="user-menu"
      [userInfo]="userInfo | async"
      (openNotifications)="openNotificationPanel.emit()" />
  </div>
</div>
