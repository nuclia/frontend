<div class="page-spacing">
  <header>
    <div class="page-title">
      {{ 'data.page-title' | translate }}
    </div>
    <div class="page-description">{{ 'data.page-description' | translate }}</div>
  </header>
  <pa-tabs notFullWidth>
    <pa-tab
      routerLink="resources"
      routerLinkActive
      #rla0="routerLinkActive"
      [active]="rla0.isActive"
      ariaControls="data-page-panel"
      (click)="scrollUp()">
      {{ 'data.tabs.resources' | translate }}
    </pa-tab>
    <pa-tab
      routerLink="sync"
      routerLinkActive
      #rla1="routerLinkActive"
      [active]="rla1.isActive"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaControls="data-page-panel"
      (click)="scrollUp()">
      {{ 'data.tabs.synchronize' | translate }}
    </pa-tab>
    @if (isAgenticSearchEnabled()) {
      <pa-tab
        routerLink="sync/connect"
        routerLinkActive
        #rla2="routerLinkActive"
        [active]="rla2.isActive"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaControls="data-page-panel"
        (click)="scrollUp()">
        <div class="tab-with-badge">
          {{ 'data.tabs.connect' | translate }}
          <nsi-badge kind="tertiary">BETA</nsi-badge>
        </div>
      </pa-tab>
    }
  </pa-tabs>

  <div id="data-page-panel">
    <router-outlet></router-outlet>
  </div>
</div>
