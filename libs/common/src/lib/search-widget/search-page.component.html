<div
  class="search-page"
  [style]="cssVariables()">
  <div
    class="search-preview-container page-spacing"
    [class.panel-open]="!configPanelCollapsed"
    [class.mode-page]="previewMode === 'page'"
    [class.mode-chat]="previewMode === 'chat'"
    (transitionend)="onPreviewContainerTransitionEnd($event)">
    <header>
      <div class="page-title">
        {{ 'search.title' | translate }}
      </div>
      <div class="page-description">{{ 'search.description' | translate }}</div>
    </header>
    <div
      #previewStage
      class="preview-stage"
      [class.dark-mode]="isPreviewDarkMode"
      [class.mode-page]="previewMode === 'page'"
      [class.mode-chat]="previewMode === 'chat'"
      [class.mode-popup]="previewMode === 'popup'"
      [class.mode-floating-chat]="previewMode === 'floating-chat'">
      @if (widgetPreview | async; as widgetPreview) {
        <div
          id="preview"
          class="preview-content"
          [innerHtml]="widgetPreview.preview"></div>
      }
    </div>
  </div>

  <pa-button
    class="toggle-panel-button"
    icon="chevrons-left"
    [class.visible]="configPanelCollapsed"
    (click)="toggleConfigurationPanel()">
    {{ 'search.configuration.action.open-panel' | translate }}
  </pa-button>

  <div
    #configurationContainer
    class="search-configuration-container"
    [class.collapsed]="configPanelCollapsed"
    (scroll)="onScroll($event)">
    <div
      class="resizer"
      (mousedown)="startResizePanel($event)">
      <div class="border"></div>
    </div>
    <pa-button
      class="close-button"
      icon="cross"
      aspect="basic"
      (click)="toggleConfigurationPanel()">
      {{ 'generic.close' | translate }}
    </pa-button>

    <stf-search-configuration
      displayWidgetButtonLine
      mainTitle="search.configuration.title"
      [configurationContainer]="configurationContainerElement()"
      [initialWidgetSlug]="initialWidgetSlug"
      (configUpdate)="updateConfig($event)"
      (widgetConfigUpdate)="updateWidgetOptions($event)"
      (getEmbedCode)="openEmbedCode($event)"></stf-search-configuration>
  </div>
</div>
