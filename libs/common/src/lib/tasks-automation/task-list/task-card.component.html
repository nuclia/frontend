<pa-card
  (cardClick)="newTask.emit()"
  [disabled]="!ready">
  <div
    class="task-card"
    [class.protect]="tones[type] === 'protect'">
    @if (!ready) {
      <nsi-badge
        class="coming-soon"
        kind="tertiary">
        {{ 'tasks-automation.coming-soon' | translate }}
      </nsi-badge>
    }

    <div class="icon-badge">
      <pa-icon
        size="medium"
        [name]="icons[type] || ''"></pa-icon>
    </div>

    <div class="card-title title-m">{{ 'tasks-automation.type.' + type + '.title' | translate }}</div>
    <div class="body-m description">{{ 'tasks-automation.type.' + type + '.description' | translate }}</div>

    <pa-icon
      class="go-arrow"
      size="small"
      name="arrow-right"></pa-icon>
  </div>
</pa-card>
