<div class="container">
  @if (centered) {
    <div class="background-layer user-background"></div>
  }
  <div
    class="user-container"
    [class.left-aligned]="alignLeft"
    [class.centered]="centered">
    <div class="logo">
      <img
        [src]="logoOverride || logoPath"
        [alt]="brandName" />
    </div>
    <div class="inner-container">
      <ng-content></ng-content>
    </div>
  </div>
  @if (!centered) {
    <div class="hero-img user-background"></div>
  }
</div>
