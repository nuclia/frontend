<div
  class="login_social"
  [class.login_social--separator-after]="separatorAfter">
  @if (!separatorAfter) {
    <div class="login_separator body-s">
      <span>{{ 'generic.or' | translate }}</span>
    </div>
  }
  <div
    class="sso-container"
    [class.sso-container--compact]="compact">
    <stf-sso-button
      provider="microsoft"
      [compact]="compact"></stf-sso-button>
    <stf-sso-button
      provider="github"
      [compact]="compact"></stf-sso-button>
    <stf-sso-button
      provider="google"
      [compact]="compact"></stf-sso-button>
  </div>
  @if (separatorAfter) {
    <div class="login_separator body-s">
      <span>{{ 'generic.or' | translate }}</span>
    </div>
  }
</div>
