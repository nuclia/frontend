@let label = labelKey | translate: { provider: providerName };

<button
  class="sso-button"
  [class.sso-button--compact]="compact"
  [attr.aria-label]="compact ? label : null"
  [paTooltip]="compact ? label : ''"
  (click)="onClick()">
  <pa-icon [path]="icon"></pa-icon>
  @if (!compact) {
    {{ label }}
  }
</button>
