<nus-user-container>
  <div class="setup-invite">
    <h2 class="setup-invite-title">{{ 'invite.title' | translate }}</h2>
    <div class="body-s">{{ 'invite.description' | translate }}</div>
    <div class="buttons">
      <pa-button
        kind="primary"
        (click)="setAccessMethod(true)">
        {{ 'invite.set-password' | translate }}
      </pa-button>
      <pa-button
        aspect="basic"
        (click)="setAccessMethod(false)">
        {{ 'invite.use-sso' | translate }}
      </pa-button>
    </div>
  </div>
</nus-user-container>
