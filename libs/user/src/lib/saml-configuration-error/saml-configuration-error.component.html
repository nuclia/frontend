<main class="saml-configuration-error">
  <section
    class="message"
    aria-labelledby="saml-error-title">
    <span
      class="marker"
      aria-hidden="true">
      !
    </span>
    <p class="eyebrow">{{ 'saml.destination_error.eyebrow' | translate }}</p>
    <h1 id="saml-error-title">{{ 'saml.destination_error.title' | translate }}</h1>
    <p class="description">{{ 'saml.destination_error.description' | translate }}</p>
    <div class="next-steps">
      <h2>{{ 'saml.destination_error.next_title' | translate }}</h2>
      <p>{{ 'saml.destination_error.next_description' | translate }}</p>
    </div>
  </section>
</main>
