server {
  listen 80;
  server_name stashify-rao;
  root /dist/;
  index index.html;
  location / {
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "0" always;
      # Inline script hashes (GTM-5C4TPN3W / rag.progress.cloud):
      #   sha256-CjFUx... = GTM loader IIFE
      #   sha256-Gp7vl... = OptanonWrapper noop
      #   sha256-AEXeA... = Pre-GTM dataLayer seed 1/3: is_mobile, see apps/rao/src/index.html
      #   sha256-JtBut... = Pre-GTM dataLayer seed 2/3: tz_offset, tz_timestamp, see apps/rao/src/index.html
      #   sha256-BTUhE... = Pre-GTM dataLayer seed 3/3: page_url_scrubbed, previous_url_scrubbed, external_referrer_scrubbed (affiliatedDomains dead-code removed 11/2025), see apps/rao/src/index.html
      # GTM tag script sources (container GTM-5C4TPN3W / rag.progress.cloud):
      #   Qualified, Eloqua, Promo Banner CDN, Claydar, LinkedIn InsightTag,
      #   LeadSpace, G2 Crowd, Clearbit, Pingdom RUM, Sitefinity Insight,
      #   Meta Pixel, Reddit Pixel, Clarity, Bing Ads UET, Twitter, Google Surveys.
      # worker-src 'self' blob: is required by Microsoft Clarity (GTM tag), which
      # spins up a session-recording compression worker from a blob: URL, and by
      # the PDF.js resource viewer, which spins up its worker from a blob: URL.
      add_header Content-Security-Policy "worker-src 'self' blob:; script-src 'self' 'sha256-CjFUxFmO8p+HqFTns+8kQJLtkFAEvIT/H4AOPmt0dw0=' 'sha256-Gp7vlxkp0urWKp+QoSObkhRevYYmLSzP7zYphDkoBrk=' 'sha256-AEXeAY+CElU+MhMhnsEGiNP9t5CbhO0JLZVb3lkwsR8=' 'sha256-JtButERV5Oj8YebQ/rGoTRRg0L6wRWbTsn1zWC3axlE=' 'sha256-BTUhEIyOTJipxMjLUnz0BawQaEdMf/taksd1qikcQ/k=' https://*.i.posthog.com https://*.posthog.com https://bat.bing.com https://capi-automation.s3.us-east-2.amazonaws.com https://cdn.cookielaw.org https://cdn.gcp-global-dev-1.nuclia.io https://cdn.insight.sitefinity.com https://cdn.rag.progress.cloud https://cdn.stashify.cloud https://connect.facebook.net https://d6vtbcy3ong79.cloudfront.net https://gcp-global-dev-1.nuclia.io https://googleads.g.doubleclick.net https://img.en25.com https://px.ads.linkedin.com https://rag.stashify.cloud https://scripts.clarity.ms https://snap.licdn.com https://static.ads-twitter.com https://www.clarity.ms https://www.googletagmanager.com https://www.redditstatic.com https://www.youtube.com; report-uri /api/csp-reports/csp; report-to csp" always;
      add_header Reporting-Endpoints "csp=\"/api/csp-reports/reporting-api/csp\"" always;

      try_files $uri /index.html =404;
  }
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
      root   /usr/share/nginx/html;
  }
}
