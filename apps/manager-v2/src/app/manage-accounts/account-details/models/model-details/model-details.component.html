<div class="px-6">
  <h3 class="mb-4 text-xl font-semibold">{{ backupModel?.location || '' }}</h3>
  <form
    class="flex max-w-lg flex-col gap-4"
    [formGroup]="kbForm"
    (ngSubmit)="save()">
    <fieldset class="flex flex-col gap-3">
      <legend class="mb-2 font-semibold">Enable on Knowledge Boxes:</legend>
      @for (kb of kbForm.controls | keyvalue; track kb.key) {
        <div
          hlmField
          orientation="horizontal">
          <hlm-checkbox
            [inputId]="'kb-' + kb.key"
            [formControlName]="kb.key" />
          <label
            hlmFieldLabel
            [for]="'kb-' + kb.key">
            {{ modelNames()[kb.key] }}
          </label>
        </div>
      }
    </fieldset>
    <footer class="flex gap-4 py-6">
      <button
        hlmBtn
        type="submit"
        [disabled]="kbForm.pristine || isSaving()">
        Save
      </button>
      <button
        hlmBtn
        type="button"
        variant="outline"
        (click)="cancel()">
        Cancel
      </button>
    </footer>
  </form>
</div>
