<div class="px-6">
  <h3 class="mb-4 text-xl font-semibold">{{ addModel ? 'Add model' : name }}</h3>
  <form
    class="flex max-w-lg flex-col gap-4"
    [formGroup]="modelForm"
    (ngSubmit)="save()">
    <div hlmField>
      <label
        hlmFieldLabel
        for="model-name">
        Name
      </label>
      <input
        hlmInput
        id="model-name"
        formControlName="description" />
    </div>
    <div hlmField>
      <label
        hlmFieldLabel
        for="model-location">
        Model
      </label>
      <input
        hlmInput
        id="model-location"
        class="read-only:bg-muted read-only:text-muted-foreground"
        formControlName="location"
        [readonly]="!addModel" />
      <p hlmFieldDescription>Use format: "provider:model"</p>
    </div>
    <div hlmField>
      <label
        hlmFieldLabel
        for="model-types">
        Model types
      </label>
      <hlm-select-multiple formControlName="model_types">
        <hlm-select-trigger
          buttonId="model-types"
          class="w-full">
          <hlm-select-values-content>
            <ng-container *hlmSelectValues="let values">{{ values.join(', ') }}</ng-container>
          </hlm-select-values-content>
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (type of modelTypes; track type) {
            <hlm-select-item [value]="type">{{ type }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select-multiple>
    </div>
    <div hlmField>
      <label
        hlmFieldLabel
        for="model-zone">
        Zone
      </label>
      <hlm-select
        formControlName="zone"
        [itemToString]="zoneLabel">
        <hlm-select-trigger
          buttonId="model-zone"
          class="w-full">
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          @for (zone of zones(); track zone.value) {
            <hlm-select-item [value]="zone.value">{{ zone.label }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>

    @if (schema | async; as schema) {
      @if (openaiCompat | async; as openaiCompat) {
        <app-user-keys
          [generativeModel]="openaiCompat"
          [learningConfigurations]="schema"
          (formReady)="userKeysForm = $event"></app-user-keys>
      }
    }

    <footer class="flex gap-4 py-6">
      <button
        hlmBtn
        type="submit"
        [disabled]="pristine || invalid || isSaving">
        Save
      </button>
    </footer>
  </form>
</div>
