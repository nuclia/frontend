<h3 class="mb-4 text-xl font-semibold">Blocked features</h3>
<form
  class="flex flex-col gap-2"
  [formGroup]="blockedFeatures"
  (ngSubmit)="save()">
  @for (feature of blockedFeatures.controls | keyvalue; track feature.key) {
    <div
      hlmField
      orientation="horizontal">
      <hlm-checkbox
        [inputId]="'blocked-' + feature.key"
        [formControlName]="feature.key" />
      <label
        hlmFieldLabel
        class="capitalize"
        [for]="'blocked-' + feature.key">
        {{ feature.key | featureName }}
      </label>
    </div>
  }

  <nma-form-footer
    secondary
    [disabled]="blockedFeatures.pristine || isSaving"
    (footerCancel)="reset()"></nma-form-footer>
</form>
