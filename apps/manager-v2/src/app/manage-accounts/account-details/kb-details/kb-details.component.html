@if (vm.kb(); as kb) {
  <div class="px-6">
    <h3 class="mb-4 text-xl font-semibold">{{ kb.slug }}</h3>
    <form
      class="flex max-w-lg flex-col gap-4"
      [formGroup]="vm.kbForm"
      (ngSubmit)="vm.save()">
      <div hlmField>
        <label
          hlmFieldLabel
          for="kb-id">
          Id
        </label>
        <div class="flex items-center gap-2">
          <input
            id="kb-id"
            hlmInput
            class="read-only:bg-muted read-only:text-muted-foreground"
            readonly
            [value]="kb.id" />
          <button
            type="button"
            hlmBtn
            variant="ghost"
            size="icon-sm"
            aria-label="Copy"
            [hlmDropdownMenuTrigger]="copyMenu">
            <ng-icon [name]="vm.copied() ? 'matCheckRound' : 'matContentCopyRound'" />
          </button>
        </div>
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="kb-created">
          Created
        </label>
        <input
          id="kb-created"
          hlmInput
          class="read-only:bg-muted read-only:text-muted-foreground"
          readonly
          [value]="kb.created" />
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="kb-zone">
          Zone
        </label>
        <input
          id="kb-zone"
          hlmInput
          class="read-only:bg-muted read-only:text-muted-foreground"
          readonly
          formControlName="zone" />
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="kb-slug">
          Slug
        </label>
        <input
          id="kb-slug"
          hlmInput
          formControlName="slug" />
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="kb-title">
          Title
        </label>
        <input
          id="kb-title"
          hlmInput
          formControlName="title" />
      </div>
      <div
        hlmField
        orientation="horizontal">
        <hlm-switch
          inputId="kb-prewarm"
          formControlName="prewarm_enabled" />
        <label
          hlmFieldLabel
          for="kb-prewarm">
          Shards pre-warming
        </label>
      </div>
      <div
        hlmField
        orientation="horizontal">
        <hlm-switch
          inputId="kb-published"
          [checked]="kb.published"
          (checkedChange)="vm.togglePublish()" />
        <label
          hlmFieldLabel
          for="kb-published">
          Published
        </label>
      </div>
      <nma-form-footer
        [disabled]="vm.kbForm.pristine || vm.kbForm.invalid || vm.isSaving()"
        (footerCancel)="vm.reset()"></nma-form-footer>
    </form>

    @if (vm.canSeeUsers()) {
      <app-kb-members [kb]="kb" />
    }
  </div>
}

<ng-template #copyMenu>
  <div
    hlmDropdownMenu
    aria-label="Copy">
    <div hlmDropdownMenuLabel>Copy</div>
    <div hlmDropdownMenuSeparator></div>
    <button
      type="button"
      hlmDropdownMenuItem
      (triggered)="vm.copy(false)">
      KB Id
    </button>
    <button
      type="button"
      hlmDropdownMenuItem
      (triggered)="vm.copy(true)">
      Account + Zone + KB
    </button>
  </div>
</ng-template>
