<div class="px-6">
  <div class="mb-4 flex gap-2">
    <button
      type="button"
      hlmBtn
      variant="outline"
      [disabled]="vm.isSaving() || !vm.canEdit()"
      (click)="vm.resetAllToDefault()">
      Reset all to default
    </button>
    <button
      type="button"
      hlmBtn
      variant="destructive"
      [disabled]="vm.isSaving() || !vm.canEdit()"
      (click)="vm.removeLimits()">
      Remove limits
    </button>
  </div>

  <form
    class="flex max-w-2xl flex-col gap-4"
    [formGroup]="vm.limitsForm"
    (ngSubmit)="vm.save()">
    @for (group of vm.limitsForm.controls | keyvalue; track group.key) {
      @if ((group.value.controls | keyvalue).length > 0) {
        <section class="mb-6 flex flex-col gap-4">
          <h3 class="mb-4 text-xl font-semibold capitalize">{{ group.key }} limits</h3>
          @for (limit of group.value.controls | keyvalue; track limit.key) {
            <app-limit-row
              [limitKey]="limit.key"
              [group]="limit.value"
              (resetToDefault)="vm.reset(group.key, limit.key)" />
          }
        </section>
      }
    }

    <nma-form-footer
      [disabled]="vm.limitsForm.pristine || vm.limitsForm.invalid || vm.isSaving()"
      (footerCancel)="vm.cancel()"></nma-form-footer>
  </form>
</div>
