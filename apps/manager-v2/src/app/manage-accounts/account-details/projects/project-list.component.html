<div class="px-6">
  <h3 class="mb-4 text-xl font-semibold">Projects</h3>
  <div hlmTableContainer>
    <table hlmTable>
      <thead hlmTHead>
        <tr hlmTr>
          <th hlmTh>Id</th>
          <th hlmTh>Project name</th>
          <th hlmTh>Zone</th>
          <th hlmTh>Description</th>
        </tr>
      </thead>
      <tbody hlmTBody>
        @for (project of projectList(); track project.project_id) {
          <tr
            hlmTr
            [class.cursor-pointer]="canAccessProjects()"
            [routerLink]="
              canAccessProjects() ? '../zone/' + project.zone.id + '/project/' + project.project_id : undefined
            ">
            <td
              hlmTd
              class="text-xs">
              {{ project.project_id }}
            </td>
            <td
              hlmTd
              class="text-xs">
              {{ project.name }}
            </td>
            <td
              hlmTd
              class="text-xs">
              {{ project.zone.title }}
            </td>
            <td
              hlmTd
              class="text-xs wrap-anywhere whitespace-normal">
              {{ project.description }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
