<div class="pa-main-container">
  <div class="pa-main-container-wide">
    <h3>New account</h3>
    <form
      style="width: 30rem"
      [formGroup]="form"
      (submit)="save()">
      <pa-input
        formControlName="email"
        required>
        Email
      </pa-input>
      <pa-input
        formControlName="slug"
        required>
        Slug
      </pa-input>
      <pa-input
        formControlName="title"
        required>
        Title
      </pa-input>
      <pa-textarea
        resizable=""
        formControlName="description">
        Description
      </pa-textarea>
      <pa-select
        formControlName="campaign_id"
        label="Campaign"
        [options]="campaignOptions"
        required></pa-select>

      <footer>
        <pa-button
          type="submit"
          kind="primary"
          [disabled]="form.pristine || form.invalid || isSaving">
          Save
        </pa-button>
        <pa-button
          kind="secondary"
          aspect="basic"
          (click)="cancel()">
          Cancel
        </pa-button>
      </footer>
    </form>
  </div>
</div>
