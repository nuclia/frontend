<footer class="flex gap-4 py-6">
  <button
    hlmBtn
    type="submit"
    [variant]="secondary() ? 'secondary' : 'default'"
    [disabled]="disabled() || !canEdit()">
    Save
  </button>
  <button
    hlmBtn
    type="button"
    variant="ghost"
    (click)="footerCancel.emit()">
    Cancel
  </button>
</footer>
