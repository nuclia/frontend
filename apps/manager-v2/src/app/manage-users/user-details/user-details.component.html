<div class="pa-main-container">
  <div class="pa-main-side-panel">
    <div class="panel-header">
      <pa-button
        icon="arrow-left"
        aspect="basic"
        (click)="goBack()">
        Back
      </pa-button>
      <div class="title-l">
        {{ userEmail }}
      </div>
    </div>
  </div>
  <div class="pa-main-container-wide">
    <h3>User details</h3>
    <form
      [formGroup]="userForm"
      (submit)="save()">
      <pa-input
        readonly
        formControlName="id">
        Id
      </pa-input>
      <pa-input
        [readonly]="!isEdit"
        formControlName="email">
        Email
      </pa-input>
      @if (!isEdit) {
        <pa-input
          readonly
          formControlName="last_login">
          Last login
        </pa-input>

        <pa-input
          [readonly]="!isEdit"
          formControlName="language">
          Language
        </pa-input>
        <pa-input
          [readonly]="!isEdit"
          formControlName="providers">
          Providers
        </pa-input>
      }
      <pa-input
        [readonly]="!isEdit"
        formControlName="name">
        Name
      </pa-input>
      <pa-select
        formControlName="type"
        [readonly]="!isEdit"
        label="Type"
        required>
        <pa-option value="USER">USER</pa-option>
        <pa-option value="ROOT">ROOT</pa-option>
        <pa-option value="MANAGER">MANAGER</pa-option>
        <pa-option value="SALES">SALES</pa-option>
        <pa-option value="READONLY">READONLY</pa-option>
      </pa-select>
      <footer>
        @if (!isEdit) {
          <pa-button
            kind="destructive"
            [disabled]="!(canEdit | async)"
            (click)="edit()">
            Edit
          </pa-button>
        } @else {
          <pa-button
            type="submit"
            kind="primary"
            [disabled]="userForm.pristine || userForm.invalid || isSaving">
            Save
          </pa-button>
          <pa-button
            kind="destructive"
            (click)="cancel()">
            Cancel
          </pa-button>
        }
      </footer>

      @if (!userForm.controls.last_login.value) {
        <pa-expander [expanded]="false">
          <pa-expander-header><span class="title-xxs">User setup URL</span></pa-expander-header>
          <pa-expander-body>
            <form class="user-setup">
              <pa-select
                label="Application"
                [value]="app()"
                (valueChange)="app.set($event)">
                <pa-option value="platform">PDP Studio</pa-option>
                <pa-option value="rag">Agentic RAG</pa-option>
              </pa-select>
              <div class="input-with-copy">
                <pa-input
                  readonly
                  value="{{ passwordPage() }}">
                  Setup URL
                </pa-input>
                <pa-button
                  aspect="basic"
                  [icon]="copied() ? 'check' : 'copy'"
                  (click)="copy()"></pa-button>
              </div>
            </form>
          </pa-expander-body>
        </pa-expander>
      }
    </form>
  </div>
</div>
