<div class="flex h-[calc(100vh-4rem)] overflow-auto">
  <aside class="w-80 shrink-0 px-6 py-4">
    <button
      hlmBtn
      type="button"
      variant="ghost"
      (click)="goBack()">
      <ng-icon name="matArrowBackRound" />
      Back
    </button>
    <div class="mt-4 text-lg font-semibold break-all">
      {{ userEmail }}
    </div>
  </aside>
  <div class="max-w-2xl flex-1 px-6 py-4">
    <h3 class="mb-4 text-xl font-semibold">User details</h3>
    <form
      class="flex flex-col gap-4"
      [formGroup]="userForm"
      (submit)="save()">
      <div hlmField>
        <label
          hlmFieldLabel
          for="user-id">
          Id
        </label>
        <input
          hlmInput
          id="user-id"
          class="read-only:bg-muted read-only:text-muted-foreground"
          readonly
          formControlName="id" />
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="user-email">
          Email
        </label>
        <input
          hlmInput
          id="user-email"
          formControlName="email" />
      </div>
      @if (!isEdit) {
        <div hlmField>
          <label
            hlmFieldLabel
            for="user-last-login">
            Last login
          </label>
          <input
            hlmInput
            id="user-last-login"
            formControlName="last_login" />
        </div>
        <div hlmField>
          <label
            hlmFieldLabel
            for="user-language">
            Language
          </label>
          <input
            hlmInput
            id="user-language"
            formControlName="language" />
        </div>
        <div hlmField>
          <label
            hlmFieldLabel
            for="user-providers">
            Providers
          </label>
          <input
            hlmInput
            id="user-providers"
            formControlName="providers" />
        </div>
      }
      <div hlmField>
        <label
          hlmFieldLabel
          for="user-name">
          Name
        </label>
        <input
          hlmInput
          id="user-name"
          formControlName="name" />
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="user-type">
          Type
        </label>
        <hlm-select formControlName="type">
          <hlm-select-trigger
            buttonId="user-type"
            class="w-full">
            <hlm-select-value />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            @for (type of userTypes; track type) {
              <hlm-select-item [value]="type">{{ type }}</hlm-select-item>
            }
          </hlm-select-content>
        </hlm-select>
      </div>
      <footer class="flex gap-4 py-6">
        @if (!isEdit) {
          <button
            hlmBtn
            type="button"
            variant="destructive"
            [disabled]="!(canEdit | async)"
            (click)="edit()">
            Edit
          </button>
        } @else {
          <button
            hlmBtn
            type="submit"
            [disabled]="userForm.pristine || userForm.invalid || isSaving">
            Save
          </button>
          <button
            hlmBtn
            type="button"
            variant="destructive"
            (click)="cancel()">
            Cancel
          </button>
        }
      </footer>
    </form>

    @if (!userForm.controls.last_login.value) {
      <hlm-accordion>
        <hlm-accordion-item>
          <hlm-accordion-trigger>User setup URL</hlm-accordion-trigger>
          <hlm-accordion-content>
            <div class="flex flex-col gap-4">
              <div hlmField>
                <label
                  hlmFieldLabel
                  for="user-setup-app">
                  Application
                </label>
                <hlm-select
                  [value]="app()"
                  (valueChange)="onAppChange($event)">
                  <hlm-select-trigger
                    buttonId="user-setup-app"
                    class="w-full">
                    <hlm-select-value />
                  </hlm-select-trigger>
                  <hlm-select-content *hlmSelectPortal>
                    <hlm-select-item value="platform">PDP Studio</hlm-select-item>
                    <hlm-select-item value="rag">Agentic RAG</hlm-select-item>
                  </hlm-select-content>
                </hlm-select>
              </div>
              <div hlmField>
                <label
                  hlmFieldLabel
                  for="user-setup-url">
                  Setup URL
                </label>
                <div hlmInputGroup>
                  <input
                    hlmInputGroupInput
                    id="user-setup-url"
                    readonly
                    [value]="passwordPage()" />
                  <div
                    hlmInputGroupAddon
                    align="inline-end">
                    <button
                      hlmInputGroupButton
                      size="icon-xs"
                      type="button"
                      aria-label="Copy setup URL"
                      (click)="copy()">
                      <ng-icon [name]="copied() ? 'matCheckRound' : 'matContentCopyRound'" />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </hlm-accordion-content>
        </hlm-accordion-item>
      </hlm-accordion>
    }
  </div>
</div>
