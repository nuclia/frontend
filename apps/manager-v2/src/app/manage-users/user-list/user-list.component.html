<div class="my-4 px-4">
  <div class="flex items-center gap-8 py-4">
    <input
      hlmInput
      class="w-80"
      placeholder="Filter"
      aria-label="Filter"
      [value]="(filter$ | async) ?? ''"
      (input)="onFilterInput($event)" />
    @if (canCreateUser | async) {
      <a
        hlmBtn
        routerLink="./add">
        <ng-icon
          name="matAddRound"
          data-icon="inline-start" />
        Add user
      </a>
    }
  </div>

  <div hlmTableContainer>
    <table hlmTable>
      <thead hlmTHead>
        <tr hlmTr>
          <th hlmTh>Id</th>
          <th hlmTh>Name</th>
          <th hlmTh>Email</th>
          <th hlmTh>Last login</th>
          <th
            hlmTh
            class="w-24"></th>
        </tr>
      </thead>
      <tbody hlmTBody>
        @for (user of users$ | async | slice: 0 : lastIndex; track user) {
          <tr
            hlmTr
            class="cursor-pointer"
            [routerLink]="user.id">
            <td hlmTd>
              <span class="text-xs">{{ user.id }}</span>
            </td>
            <td
              hlmTd
              class="wrap-anywhere whitespace-normal">
              {{ user.name }}
            </td>
            <td
              hlmTd
              class="wrap-anywhere whitespace-normal">
              {{ user.email }}
            </td>
            <td hlmTd>{{ (user.last_login | date: 'M/d/y') || '–' }}</td>
            <td
              hlmTd
              class="text-end">
              @if (canDelete | async) {
                <button
                  hlmBtn
                  type="button"
                  variant="destructive"
                  size="icon-sm"
                  aria-label="Delete user"
                  (click)="deleteUser($event, user)">
                  <ng-icon name="matDeleteRound" />
                </button>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <ui-infinite-scroll (reachAnchor)="onReachAnchor()" />
</div>
