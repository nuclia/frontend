<div class="pa-main-container">
  <div class="pa-main-container-wide">
    <h3>New user</h3>
    <form
      [formGroup]="form"
      (submit)="save()">
      <pa-input
        formControlName="name"
        required>
        Name
      </pa-input>
      <pa-input
        formControlName="email"
        required>
        Email
      </pa-input>
      <pa-select
        formControlName="type"
        required>
        <pa-option value="USER">USER</pa-option>
        <pa-option value="ROOT">ROOT</pa-option>
        <pa-option value="MANAGER">MANAGER</pa-option>
        <pa-option value="SALES">SALES</pa-option>
        <pa-option value="READONLY">READONLY</pa-option>
      </pa-select>
      <footer>
        <pa-button
          type="submit"
          kind="primary"
          [disabled]="form.pristine || form.invalid || isSaving">
          Save
        </pa-button>
        <pa-button
          kind="destructive"
          (click)="cancel()">
          Cancel
        </pa-button>
      </footer>
      <div>
        <label class="title-s">Page to initiate the password:</label>
        <div class="input-with-copy">
          <pa-input
            readonly
            value="{{ passwordPage }}"></pa-input>
          <pa-button
            aspect="basic"
            [icon]="copied() ? 'check' : 'copy'"
            (click)="copy()"></pa-button>
        </div>
      </div>
    </form>
  </div>
</div>
