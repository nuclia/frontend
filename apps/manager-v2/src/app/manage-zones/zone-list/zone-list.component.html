<div class="my-4 px-4">
  <div class="flex items-center gap-8 py-4">
    <input
      hlmInput
      class="w-80"
      placeholder="Filter"
      aria-label="Filter"
      [value]="(filter$ | async) ?? ''"
      (input)="onFilterInput($event)" />
    <a
      hlmBtn
      routerLink="./add">
      <ng-icon
        name="matAddRound"
        data-icon="inline-start" />
      Add zone
    </a>
  </div>

  <div hlmTableContainer>
    <table hlmTable>
      <thead hlmTHead>
        <tr hlmTr>
          <th hlmTh>Id</th>
          <th hlmTh>Slug</th>
          <th hlmTh>Title</th>
          <th hlmTh>Private</th>
          <th hlmTh>Origin</th>
          <th hlmTh>Cloud provider</th>
          <th
            hlmTh
            class="w-24"></th>
        </tr>
      </thead>
      <tbody hlmTBody>
        @for (zone of zones$ | async | slice: 0 : lastIndex; track zone.slug) {
          <tr
            hlmTr
            class="cursor-pointer"
            [routerLink]="zone.id">
            <td hlmTd>
              <span class="text-xs">{{ zone.id }}</span>
            </td>
            <td
              hlmTd
              class="wrap-anywhere whitespace-normal">
              {{ zone.slug }}
            </td>
            <td
              hlmTd
              class="wrap-anywhere whitespace-normal">
              {{ zone.title }}
            </td>
            <td hlmTd>{{ zone.private ? 'Yes' : 'No' }}</td>
            <td
              hlmTd
              class="wrap-anywhere whitespace-normal">
              <span class="text-xs">{{ zone.origin || '—' }}</span>
            </td>
            <td hlmTd>{{ zone.cloud_provider }}</td>
            <td
              hlmTd
              class="text-end">
              <button
                hlmBtn
                type="button"
                variant="destructive"
                size="icon-sm"
                aria-label="Delete zone"
                (click)="deleteZone($event, zone)">
                <ng-icon name="matDeleteRound" />
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <ui-infinite-scroll (reachAnchor)="onReachAnchor()" />
</div>
