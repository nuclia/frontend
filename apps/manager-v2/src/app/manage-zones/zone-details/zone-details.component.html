<div class="flex h-[calc(100vh-4rem)] overflow-auto">
  <aside class="w-80 shrink-0 px-6 py-4">
    <button
      hlmBtn
      type="button"
      variant="ghost"
      (click)="vm.goBack()">
      <ng-icon name="matArrowBackRound" />
      Back
    </button>
    <div class="mt-4 text-lg font-semibold break-all">
      {{ vm.zoneTitle() }}
    </div>
  </aside>
  <div class="max-w-2xl flex-1 px-6 py-4">
    <h3 class="mb-4 text-xl font-semibold">{{ vm.addZone() ? 'Add zone' : 'Zone details' }}</h3>
    <form
      class="flex flex-col gap-4"
      [formGroup]="vm.zoneForm"
      (submit)="vm.save()">
      @if (!vm.addZone()) {
        <div hlmField>
          <label
            hlmFieldLabel
            for="zone-id">
            Id
          </label>
          <input
            hlmInput
            id="zone-id"
            class="read-only:bg-muted read-only:text-muted-foreground"
            readonly
            formControlName="id" />
        </div>
      }
      <div hlmField>
        <label
          hlmFieldLabel
          for="zone-slug">
          Slug
        </label>
        <input
          hlmInput
          id="zone-slug"
          formControlName="slug" />
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="zone-title">
          Title
        </label>
        <input
          hlmInput
          id="zone-title"
          formControlName="title" />
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="zone-cloud-provider">
          Cloud provider
        </label>
        <hlm-select formControlName="cloud_provider">
          <hlm-select-trigger
            buttonId="zone-cloud-provider"
            class="w-full">
            <hlm-select-value />
          </hlm-select-trigger>
          <hlm-select-content *hlmSelectPortal>
            <hlm-select-item value="GCP">GCP</hlm-select-item>
            <hlm-select-item value="AWS">AWS</hlm-select-item>
          </hlm-select-content>
        </hlm-select>
      </div>
      <div hlmField>
        <label
          hlmFieldLabel
          for="zone-origin">
          Origin (optional — overrides zone URL)
        </label>
        <input
          hlmInput
          id="zone-origin"
          formControlName="origin" />
      </div>
      @if (!vm.addZone()) {
        <div hlmField>
          <label
            hlmFieldLabel
            for="zone-creator">
            Creator
          </label>
          <input
            hlmInput
            id="zone-creator"
            class="read-only:bg-muted read-only:text-muted-foreground"
            readonly
            formControlName="creator" />
        </div>
        <div hlmField>
          <label
            hlmFieldLabel
            for="zone-created">
            Created
          </label>
          <input
            hlmInput
            id="zone-created"
            class="read-only:bg-muted read-only:text-muted-foreground"
            readonly
            formControlName="created" />
        </div>
        <div hlmField>
          <label
            hlmFieldLabel
            for="zone-modified">
            Modified
          </label>
          <input
            hlmInput
            id="zone-modified"
            class="read-only:bg-muted read-only:text-muted-foreground"
            readonly
            formControlName="modified" />
        </div>
      }
      <div
        hlmField
        orientation="horizontal">
        <hlm-checkbox
          inputId="zone-private"
          formControlName="private" />
        <label
          hlmFieldLabel
          for="zone-private">
          Private
        </label>
      </div>

      <footer class="flex gap-4 py-6">
        <button
          hlmBtn
          type="submit"
          [disabled]="vm.zoneForm.pristine || vm.zoneForm.invalid || vm.isSaving()">
          Save
        </button>
        @if (!vm.addZone()) {
          <button
            hlmBtn
            type="button"
            variant="ghost"
            (click)="vm.reset()">
            Cancel
          </button>
        }
      </footer>
    </form>

    @if (!vm.addZone()) {
      <app-zone-accounts [zoneId]="vm.zoneId()" />
    }
  </div>
</div>
